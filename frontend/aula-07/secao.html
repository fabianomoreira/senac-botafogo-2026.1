<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags Semânticas</title>

    <style>
        #principal{
            background-color: gray;
        }
        #coluna{
            background-color: pink;
            width: 50%;
        }
    </style>
</head>
<body>
    <div id="principal">
        <p>Primeira DIV</p>
        <div id="coluna">
            <h1>WWF</h1>
            <p>A fundação fulaninha é responsável pela definição de padrões do HTML</p>
        </div>
        <section style="width: 50%; background-color: pink;">
            <h1>WWF</h1>
            <p>A fundação fulaninha é responsável pela definição de padrões do HTML</p>
        </section>
    </div>
</body>
</html>
