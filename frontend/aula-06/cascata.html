<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de classes em cascata</title>

    <style>
        .letra {
            font-size: 100px;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: bold;
        }
        .cor {
            color: red;
        }
    </style>
</head>
<body>
    <p class="cor">Telefone Celular</p>
    <p class="letra">Telefone iPhone</p>
    <p class="cor letra">Telefone Android</p>
</body>
</html>
