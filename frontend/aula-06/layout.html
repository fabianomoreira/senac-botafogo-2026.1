<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de DIV e SPAN</title>

    <style>
        div {
            /* djfalksdjfalsj */
            background-color: black;
        }
        p {
            color:white;
            font-size: 60px;
            font-family: Arial;
        }
        #sexta {
            font-size: 40px;
            color:yellow;
        }
        .flamengo {
            font-size: 70px;
            color: red;
            background-color: black;
        }
    </style>
</head>
<body>
    <div>
         <p class="flamengo">Eu estou aqui!</p>
    </div>
    <div>
        <p id="sexta">Eu estava lá!</p>
    </div>
    <span style="background-color: red;">Exemplo de uso do SPAN</span>
    <h1>Exemplo de <span style="background-color: aquamarine;">uso</span> do SPAN</h1>
</body>
</html>
