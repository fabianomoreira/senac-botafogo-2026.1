<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definição de borda</title>
</head>
<body>
    <p style="border-style: groove; margin:auto; width: 30%; border-width: 20px;">aplicação de borda</p>
    <p style="border-style: solid; width: 30%">aplicação de borda</p>
    <p style="border-style: dashed; width: 30%">aplicação de borda</p>
    <p style="border-style: dotted; width: 30%">aplicação de borda</p>
    <p style="border-style: double; width: 30%">aplicação de borda</p>
    <p style="border-style: solid dashed dotted double; width: 30%; margin: 30px;">aplicação de borda</p>    
    <p style="border-style: double none double none; width: 30%">aplicação de borda</p>  
    <p style="border-style: solid; width: 30%; border-width: 10px; border-color: blue;">aplicação de borda</p>
    <p style="border-style: solid; width: 30%; border-width: 10px; border-color: #b525e8;">aplicação de borda</p>
    <p style="border-style: solid; width: 30%; border-radius: 5px; border-color: red;">aplicação de borda</p>
    <p style="border-style: solid; width: 30%; border-radius: 15px; border-color: red;">aplicação de borda</p>
    <p style="border-style: solid; width: 30%; border-radius: 15px; padding: 20px; border-color: red;">aplicação de borda</p>
</body>
</body>
</html>
